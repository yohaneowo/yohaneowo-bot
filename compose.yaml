services:
    portfolio-bot:
        build: .
        # :latest is the stable (main) build, :dev the develop build (npm run docker:release / docker:dev).
        image: yohane0w0/yohaneowo-bot:${IMAGE_TAG:-latest}
        container_name: yohaneowo-bot
        restart: unless-stopped
        init: true
        # Dynamic voice channel state (/voice-hub); survives image updates.
        volumes:
            - bot-data:/app/data
        env_file:
            - .env
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'

volumes:
    bot-data:
