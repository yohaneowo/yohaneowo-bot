# Compose file for the NAS: pulls the published image instead of building.
# Put it next to a .env holding DOPPLER_TOKEN (a service token for Doppler yohaneowo-bot / prd) and
# CLOUDFLARE_TUNNEL_TOKEN, then run `docker compose -f compose.nas.yaml up -d`
# (or create a Container Manager project from it). The bots read every other setting from Doppler.
# Changed a value in Doppler? Restart the bot containers to pick it up.
#
# The bots report groups, logs and total assets to yohaneowo-admin over its Docker network
# (yohaneowo-admin/docker/nas). Start the admin first: this file joins its network, so the
# bots fail to start while it is missing. ADMIN_API_TOKEN in Doppler must equal the admin's BOT_API_TOKEN.
services:
    portfolio-bot:
        image: yohane0w0/yohaneowo-bot:latest
        container_name: yohaneowo-bot
        restart: unless-stopped
        init: true
        # Dynamic voice channel state (/voice-hub); survives image updates.
        volumes:
            - bot-data:/app/data
        environment: &bot_env
            DOPPLER_TOKEN: ${DOPPLER_TOKEN:?Set DOPPLER_TOKEN in .env (Doppler yohaneowo-bot / prd service token)}
            # Service addresses inside Docker stay here, not in Doppler.
            XHS_API_URL: http://xhs-downloader:5556
            ADMIN_API_URL: http://yohaneowo-admin-web
        networks: &bot_networks
            - default
            - admin
        logging: &logging
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'

    # LINE webhook + media server, reached through the Cloudflare Tunnel below.
    line-bot:
        image: yohane0w0/yohaneowo-bot:latest
        container_name: yohaneowo-line-bot
        restart: unless-stopped
        init: true
        command: ['node', 'line.js']
        environment: *bot_env
        networks: *bot_networks
        logging: *logging

    # Xiaohongshu note lookups (https://github.com/JoeanAmier/XHS-Downloader). Internal only:
    # no published ports, the bots reach it as http://xhs-downloader:5556.
    xhs-downloader:
        image: joeanamier/xhs-downloader:latest
        container_name: yohaneowo-xhs-downloader
        restart: unless-stopped
        command: ['python', 'main.py', 'api']
        logging: *logging

    # Public hostname (e.g. line.yohaneowo.com) -> http://line-bot:8787, configured in Cloudflare Zero Trust.
    cloudflared:
        image: cloudflare/cloudflared:latest
        container_name: yohaneowo-cloudflared
        restart: unless-stopped
        command: ['tunnel', '--no-autoupdate', 'run']
        environment:
            TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
        depends_on:
            - line-bot
        logging: *logging

volumes:
    bot-data:

networks:
    # Created by yohaneowo-admin's compose; the admin answers here as yohaneowo-admin-web.
    admin:
        name: yohaneowo-admin
        external: true
