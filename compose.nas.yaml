# Compose file for the NAS: pulls the published image instead of building.
# Put it next to the stable .env and run `docker compose -f compose.nas.yaml up -d`
# (or create a Container Manager project from it).
services:
    portfolio-bot:
        image: yohane0w0/yohaneowo-bot:latest
        container_name: yohaneowo-bot
        restart: unless-stopped
        init: true
        # Dynamic voice channel state (/voice-hub); survives image updates.
        volumes:
            - bot-data:/app/data
        env_file:
            - .env
        environment: &xhs_env
            XHS_API_URL: http://xhs-downloader:5556
        logging: &logging
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'

    # LINE webhook + media server, reached through the Cloudflare Tunnel below.
    line-bot:
        image: yohane0w0/yohaneowo-bot:latest
        container_name: yohaneowo-line-bot
        restart: unless-stopped
        init: true
        command: ['node', 'line.js']
        env_file:
            - .env
        environment: *xhs_env
        logging: *logging

    # Xiaohongshu note lookups (https://github.com/JoeanAmier/XHS-Downloader). Internal only:
    # no published ports, the bots reach it as http://xhs-downloader:5556.
    xhs-downloader:
        image: joeanamier/xhs-downloader:latest
        container_name: yohaneowo-xhs-downloader
        restart: unless-stopped
        command: ['python', 'main.py', 'api']
        logging: *logging

    # Public hostname (e.g. line.yohaneowo.com) -> http://line-bot:8787, configured in Cloudflare Zero Trust.
    cloudflared:
        image: cloudflare/cloudflared:latest
        container_name: yohaneowo-cloudflared
        restart: unless-stopped
        command: ['tunnel', '--no-autoupdate', 'run']
        environment:
            TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
        depends_on:
            - line-bot
        logging: *logging

volumes:
    bot-data:
